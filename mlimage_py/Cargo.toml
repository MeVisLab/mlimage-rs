[package]
name = "mlimage_py"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
homepage = "https://github.com/MeVisLab/mlimage-rs"
repository = "https://github.com/MeVisLab/mlimage-rs"
description = "Python bindings for mlimage-rs, exposing a reader for MeVisLab's MLImage file format for medical imaging"

[lib]
name = "mlimage"
crate-type = ["cdylib"]

[dependencies]
mlimage-rs = { version = "0.1.0", path = "../mlimage_format" }
numpy = "0.28.0"
pyo3 = { version = "0.28.2", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.28.0", features = ["attributes", "tokio-runtime"] }
tokio = { version = "1.43.0", features = ["sync"] }
